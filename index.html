<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SHVETS DESIGN — предметный дизайн / авторские объекты</title>
<meta name="description" content="SHVETS DESIGN — авторские предметы и арт-объекты.">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#121d24}
body{margin:0;color:#eef2f4;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden;background:#121d24}
.hero-exact{position:relative;width:100%;height:calc(100vw * 400 / 1672);min-height:360px;max-height:520px;background:#17242c url('assets/hero-approved.webp?v=1') center top/100% 100% no-repeat}
.hit{position:absolute;display:block;background:transparent;border:0;text-decoration:none;cursor:pointer}
.hit-catalog{left:3.82%;top:78.5%;width:14.6%;height:10.5%}.hit-works{left:33.6%;top:8.4%;width:4.5%;height:10%}.hit-art{left:39%;top:8.4%;width:7.5%;height:10%}.hit-about{left:47.4%;top:8.4%;width:6.8%;height:10%}.hit-order{left:55%;top:8.4%;width:11%;height:10%}.hit-discuss{right:2.1%;top:5.4%;width:11.4%;height:15%}
.catalog-shell{min-height:540px;padding:27px 4.65vw 60px;background:radial-gradient(ellipse at 49% -12%,rgba(137,157,168,.13),transparent 42%),linear-gradient(180deg,#29343b 0%,#222d34 54%,#172229 100%);border-top:1px solid rgba(205,220,227,.08)}
.catalog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;margin:0 0 16px}.catalog-title{margin:0;color:#f0f3f5;font-size:18px;font-weight:400;letter-spacing:5px;line-height:1.15;text-transform:uppercase}.catalog-count{margin-top:5px;color:#87949d;font-size:13px;letter-spacing:.3px}.catalog-actions{display:flex;align-items:center;gap:16px;margin-top:-3px;color:#929da5}.filter-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#929da5}.filter-wrap{position:relative}.filter-wrap select{height:34px;min-width:165px;padding:0 38px 0 16px;appearance:none;-webkit-appearance:none;border:1px solid rgba(194,205,213,.18);background:rgba(37,48,55,.58);color:#9ba7ae;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;outline:none}.filter-wrap:after{content:'';position:absolute;right:14px;top:12px;width:7px;height:7px;border-right:1px solid #7f8a92;border-bottom:1px solid #7f8a92;transform:rotate(45deg);pointer-events:none}.grid-icon{display:grid;grid-template-columns:repeat(2,8px);grid-template-rows:repeat(2,8px);gap:2px;margin-left:18px}.grid-icon i{display:block;border:1px solid #a1abb1;width:8px;height:8px}
#legacy{display:block;width:100%;height:900px;border:0;background:transparent;overflow:hidden}.loading{height:220px;display:flex;align-items:center;justify-content:center;color:#7f8b93;font-size:11px;letter-spacing:2px;text-transform:uppercase}
@media(max-width:900px){.hero-exact{height:56vw;min-height:360px;background-size:cover;background-position:center top}.catalog-shell{padding:24px 18px 46px}.catalog-title{font-size:15px;letter-spacing:3px}.catalog-actions{gap:8px}.filter-label{display:none}.filter-wrap select{min-width:145px}}
@media(max-width:620px){.hero-exact{height:72vw;min-height:430px;background-size:auto 100%;background-position:center top}.catalog-head{display:block}.catalog-actions{margin-top:14px;justify-content:flex-end}}
</style>
</head>
<body>
<section class="hero-exact" aria-label="SHVETS DESIGN">
<a class="hit hit-works" href="#catalog" aria-label="Работы"></a><a class="hit hit-art" href="#catalog" aria-label="Арт-объекты"></a><a class="hit hit-about" href="#catalog" aria-label="Обо мне"></a><a class="hit hit-order" href="#catalog" aria-label="Индивидуальный заказ"></a><a class="hit hit-discuss" href="#catalog" aria-label="Обсудить проект"></a><a class="hit hit-catalog" href="#catalog" aria-label="Смотреть каталог"></a>
</section>
<section id="catalog" class="catalog-shell">
<div class="catalog-head"><div><h2 class="catalog-title">Каталог объектов</h2><div class="catalog-count" id="catalogCount">28 уникальных объектов</div></div><div class="catalog-actions"><span class="filter-label">Фильтр:</span><div class="filter-wrap"><select id="catalogFilter" aria-label="Фильтр каталога"><option value="all">Все категории</option><option value="art">Арт-объекты</option><option value="chair">Кресла / стулья</option><option value="light">Светильники</option><option value="table">Столы / консоли</option></select></div><span class="grid-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div></div>
<div id="loading" class="loading">Загрузка каталога</div><iframe id="legacy" src="legacy.html?v=5" title="Каталог SHVETS DESIGN"></iframe>
</section>
<script>
const frame=document.getElementById('legacy'),loading=document.getElementById('loading'),count=document.getElementById('catalogCount'),filter=document.getElementById('catalogFilter');
function resizeFrame(){try{const d=frame.contentDocument,g=d&&d.querySelector('#grid');if(!g)return;const r=g.getBoundingClientRect();frame.style.height=Math.max(600,Math.ceil(r.bottom+20))+'px'}catch(e){}}
function applyFilter(){try{const d=frame.contentDocument;if(!d)return;const cards=[...d.querySelectorAll('#grid .card')],v=filter.value;let shown=0;cards.forEach(card=>{const t=(card.textContent||'').toLowerCase();let ok=true;if(v==='art')ok=/арт|art-|скульп|объект/.test(t);if(v==='chair')ok=/кресл|стул|chair|bench|скам/.test(t);if(v==='light')ok=/свет|ламп|люстр|lighting/.test(t);if(v==='table')ok=/стол|комод|консол|table/.test(t);card.style.display=ok?'':'none';if(ok)shown++});count.textContent=(v==='all'?cards.length:shown)+' уникальных объектов';requestAnimationFrame(resizeFrame)}catch(e){}}
frame.addEventListener('load',()=>{try{
 const d=frame.contentDocument,w=frame.contentWindow,g=d.querySelector('#grid'),works=d.querySelector('#works');
 if(!g||!works)return;
 const style=d.createElement('style');
 style.textContent=`html,body{margin:0!important;background:transparent!important;overflow:hidden!important;min-height:0!important}header,.hero,#about,#objects,#contact,footer{display:none!important}main{margin:0!important;padding:0!important;background:transparent!important}.section#works{display:block!important;margin:0!important;padding:0!important;border:0!important;background:transparent!important;min-height:0!important}.section#works>.shell{width:100%!important;max-width:none!important;margin:0!important;padding:0!important}.section#works .headrow{display:none!important}#grid,.grid{margin:0!important;padding:0!important;gap:24px 16px!important;grid-template-columns:repeat(12,1fr)!important}.card{grid-column:span 3!important;margin:0!important;background:rgba(14,22,27,.72)!important;border-color:rgba(224,236,241,.14)!important;box-shadow:none!important}.card-media{background:transparent!important;isolation:isolate!important}.cover-natural-bg{inset:0!important;filter:none!important;transform:none!important;opacity:1!important;background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important}.cover-natural-bg:after{background:linear-gradient(180deg,rgba(13,22,27,.02),rgba(11,18,22,.10))!important}.single-cover{object-fit:contain!important;object-position:center!important;filter:none!important}.card-copy{background:linear-gradient(180deg,rgba(23,33,39,.86),rgba(13,21,26,.95))!important}@media(max-width:1200px){.card{grid-column:span 4!important}}@media(max-width:900px){#grid,.grid{gap:14px!important}.card{grid-column:span 6!important}}@media(max-width:560px){.card{grid-column:1/-1!important}}`;
 d.head.appendChild(style);
 const cards=[...d.querySelectorAll('#grid .card')],DATA=w.DATA;
 if(cards[0]&&DATA&&DATA[0]&&DATA[0].images&&DATA[0].images[5]){const bg=cards[0].querySelector('.cover-natural-bg'),photo6=DATA[0].images[5];if(bg){bg.style.backgroundImage=`url('${photo6.replace(/'/g,"%27")}')`;}}
 cards.forEach((card,i)=>{if(i===0)return;const bg=card.querySelector('.cover-natural-bg'),img=card.querySelector('.single-cover');if(bg&&img&&img.src){bg.style.backgroundImage=`url('${img.src.replace(/'/g,"%27")}')`;}});
 loading.style.display='none';count.textContent=cards.length+' уникальных объектов';applyFilter();resizeFrame();
 if('ResizeObserver'in window){const ro=new ResizeObserver(resizeFrame);ro.observe(g)}setTimeout(resizeFrame,250);setTimeout(resizeFrame,900);
}catch(e){console.error(e)}});
filter.addEventListener('change',applyFilter);window.addEventListener('resize',()=>setTimeout(resizeFrame,120));
</script>
</body>
</html>
