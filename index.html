<head>

<meta name="description" content="SHVETS DESIGN — авторские предметы и арт-объекты.">
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth;background:#273036}body{margin:0;background:#273036;color:#e9eef1;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}.hero-exact{position:relative;width:100%;height:calc(100vw * 400 / 1672);min-height:310px;max-height:520px;background-image:url('assets/hero-reference.webp?v=3');background-size:100% 100%;background-repeat:no-repeat;background-position:center top;background-color:#17242c}.hit{position:absolute;display:block;background:transparent;border:0;text-decoration:none;cursor:pointer}.hit-catalog{left:3.82%;top:78.5%;width:14.6%;height:10.5%}.hit-works{left:33.6%;top:8.4%;width:4.5%;height:10%}.hit-art{left:39%;top:8.4%;width:7.5%;height:10%}.hit-about{left:47.4%;top:8.4%;width:6.8%;height:10%}.hit-order{left:55%;top:8.4%;width:11%;height:10%}.hit-discuss{right:2.1%;top:5.4%;width:11.4%;height:15%}.catalog-shell{min-height:540px;background:radial-gradient(circle at 50% -10%,rgba(105,126,138,.10),transparent 43%),linear-gradient(180deg,#283239 0%,#252f35 56%,#222c32 100%);padding:28px 4.65vw 60px}.catalog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;margin:0 0 16px}.catalog-title{margin:0;color:#edf1f3;font-size:18px;font-weight:400;letter-spacing:5px;line-height:1.15;text-transform:uppercase}.catalog-count{margin-top:5px;color:#849099;font-size:13px;letter-spacing:.3px}.catalog-actions{display:flex;align-items:center;gap:16px;margin-top:-3px;color:#929da5}.filter-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#929da5}.filter-wrap{position:relative}.filter-wrap select{height:34px;min-width:165px;padding:0 38px 0 16px;appearance:none;-webkit-appearance:none;border:1px solid rgba(194,205,213,.18);background:rgba(40,50,57,.55);color:#98a4ac;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;outline:none}.filter-wrap:after{content:'';position:absolute;right:14px;top:12px;width:7px;height:7px;border-right:1px solid #7f8a92;border-bottom:1px solid #7f8a92;transform:rotate(45deg);pointer-events:none}.grid-icon{display:grid;grid-template-columns:repeat(2,8px);grid-template-rows:repeat(2,8px);gap:2px;margin-left:18px}.grid-icon i{display:block;border:1px solid #9ca7ad;width:8px;height:8px}#legacy{display:block;width:100%;height:900px;border:0;background:transparent;overflow:hidden}.loading{height:220px;display:flex;align-items:center;justify-content:center;color:#7f8b93;font-size:11px;letter-spacing:2px;text-transform:uppercase}@media(max-width:900px){.hero-exact{height:56vw;min-height:360px;background-size:cover;background-position:center top}.catalog-shell{padding:24px 18px 46px}.catalog-head{align-items:flex-end}.catalog-title{font-size:15px;letter-spacing:3px}.catalog-actions{gap:8px}.filter-label{display:none}.filter-wrap select{min-width:145px}}@media(max-width:620px){.hero-exact{height:72vw;min-height:430px;background-size:auto 100%;background-position:center top}.catalog-head{display:block}.catalog-actions{margin-top:14px;justify-content:flex-end}}
</style>
</head>
<body>
<section class="hero-exact" aria-label="SHVETS DESIGN">
<a class="hit hit-works" href="#catalog" aria-label="Работы"></a><a class="hit hit-art" href="#catalog" aria-label="Арт-объекты"></a><a class="hit hit-about" href="#catalog" aria-label="Обо мне"></a><a class="hit hit-order" href="#catalog" aria-label="Индивидуальный заказ"></a><a class="hit hit-discuss" href="#catalog" aria-label="Обсудить проект"></a><a class="hit hit-catalog" href="#catalog" aria-label="Смотреть каталог"></a>
</section>
<section id="catalog" class="catalog-shell">
<div class="catalog-head"><div><h2 class="catalog-title">Каталог объектов</h2><div class="catalog-count" id="catalogCount">28 уникальных объектов</div></div><div class="catalog-actions"><span class="filter-label">Фильтр:</span><div class="filter-wrap"><select id="catalogFilter" aria-label="Фильтр каталога"><option value="all">Все категории</option><option value="art">Арт-объекты</option><option value="chair">Кресла / стулья</option><option value="light">Светильники</option><option value="table">Столы / консоли</option></select></div><span class="grid-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div></div>
<div id="loading" class="loading">Загрузка каталога</div><iframe id="legacy" src="legacy.html?v=4" title="Каталог SHVETS DESIGN"></iframe>
</section>
<script>
const frame=document.getElementById('legacy'),loading=document.getElementById('loading'),count=document.getElementById('catalogCount'),filter=document.getElementById('catalogFilter');
function resizeFrame(){try{const d=frame.contentDocument,g=d&&d.querySelector('#grid');if(!g)return;frame.style.height=Math.max(600,Math.ceil(g.getBoundingClientRect().bottom+24))+'px'}catch(e){}}
function applyFilter(){const d=frame.contentDocument;if(!d)return;const cards=[...d.querySelectorAll('#grid .card')],v=filter.value;let shown=0;cards.forEach(card=>{const t=(card.textContent||'').toLowerCase();let ok=true;if(v==='art')ok=/арт|art-|скульп|объект/.test(t);if(v==='chair')ok=/кресл|стул|chair|bench|скам/.test(t);if(v==='light')ok=/свет|ламп|люстр|lighting/.test(t);if(v==='table')ok=/стол|комод|консол|table/.test(t);card.style.display=ok?'':'none';if(ok)shown++});count.textContent=(v==='all'?cards.length:shown)+' уникальных объектов';requestAnimationFrame(resizeFrame)}
frame.addEventListener('load',()=>{const d=frame.contentDocument;if(!d)return;const s=d.createElement('style');s.textContent=`html,body{background:transparent!important;overflow:hidden!important}body{min-height:0!important}header,.topbar,.hero{display:none!important}main{padding:0!important;margin:0!important;background:transparent!important}.section-h,.count{display:none!important}#grid,.grid{margin:0!important;padding:0!important;gap:24px 16px!important}.card{margin:0!important}@media(max-width:900px){#grid,.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important}}@media(max-width:560px){#grid,.grid{grid-template-columns:1fr!important}}`;d.head.appendChild(s);let n=0;const done=()=>{n++;const cards=[...d.querySelectorAll('#grid .card')];if(cards.length<28&&n<160){setTimeout(done,100);return}try{const card=cards[0],DATA=frame.contentWindow.DATA;if(card&&DATA&&DATA[0]&&DATA[0].images&&DATA[0].images[5]){const photo6=DATA[0].images[5],media=card.querySelector('.card-media')||card,bg=card.querySelector('.cover-natural-bg');if(bg){bg.style.backgroundImage='url("'+photo6+'")';bg.style.backgroundSize='cover';bg.style.backgroundPosition='center';bg.style.filter='none';bg.style.transform='none';bg.style.opacity='1';bg.style.inset='0'}else{media.style.backgroundImage='url("'+photo6+'")';media.style.backgroundSize='cover';media.style.backgroundPosition='center'}media.style.backgroundColor='transparent'}}catch(e){}loading.style.display='none';count.textContent=cards.length+' уникальных объектов';applyFilter();resizeFrame();if('ResizeObserver'in window){const ro=new ResizeObserver(resizeFrame),g=d.querySelector('#grid');if(g)ro.observe(g)}setTimeout(resizeFrame,300);setTimeout(resizeFrame,1000)};done()});filter.addEventListener('change',applyFilter);window.addEventListener('resize',()=>setTimeout(resizeFrame,120));
</script>
</body>
</html>
